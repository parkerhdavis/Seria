<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Seria - Cell Editor</title>
		<link rel="stylesheet" href="./styles/index.css" />
		<style>
			/* Inline styles for the instant loading screen — no external CSS
			   dependency, so it paints before the Tailwind bundle loads. */
			#loading-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #ffffff;
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 9999;
				transition: opacity 0.3s ease-out;
			}

			body.loaded #loading-screen {
				opacity: 0;
				pointer-events: none;
			}

			@media (prefers-color-scheme: dark) {
				#loading-screen {
					background-color: #1f2937;
				}
			}
		</style>
	</head>
	<body>
		<div id="loading-screen"></div>
		<div id="root"></div>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
