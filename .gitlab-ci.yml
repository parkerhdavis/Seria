# GitLab CI/CD Pipeline for Seria Multi-Platform Builds
# Builds for Linux, Windows, and macOS

stages:
    - test
    - build

# Variables shared across all jobs
variables:
    # Cargo settings for faster builds
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    # Node modules cache
    NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm

# Cache dependencies to speed up builds
.cache_template: &cache_template
    key:
        files:
            - frontend/package-lock.json
            - backend/Cargo.lock
    paths:
        - frontend/node_modules/
        - .cargo/
        - .npm/
        - backend/target/

# ==============================================================================
# TEST STAGE
# ==============================================================================

lint:
    stage: test
    image: node:18
    cache:
        <<: *cache_template
    before_script:
        - cd frontend && npm ci
    script:
        - npm run lint
    only:
        - merge_requests
        - main

# ==============================================================================
# BUILD STAGE - Linux
# ==============================================================================

build:linux:
    stage: build
    image: ubuntu:22.04
    cache:
        <<: *cache_template
    before_script:
        # Install system dependencies
        - apt-get update
        - apt-get install -y curl wget file build-essential libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
        # Install Node.js
        - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
        - apt-get install -y nodejs
        # Install Rust
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        - source $HOME/.cargo/env
        # Install frontend dependencies
        - cd frontend && npm ci
    script:
        # Build frontend
        - cd frontend && npm run build
        # Build Tauri app for Linux
        - cd ../backend && ../frontend/node_modules/.bin/tauri build
    artifacts:
        paths:
            - backend/target/release/bundle/appimage/*.AppImage
            - backend/target/release/bundle/deb/*.deb
            - backend/target/release/bundle/rpm/*.rpm
        expire_in: 30 days
    only:
        - tags
        - main

# ==============================================================================
# BUILD STAGE - Windows
# ==============================================================================

build:windows:
    stage: build
    tags:
        - windows
    before_script:
        # Install Node.js (assuming Windows runner has chocolatey)
        - choco install nodejs -y
        # Install Rust
        - |
            if (-not (Get-Command rustc -ErrorAction SilentlyContinue)) {
                Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
                .\rustup-init.exe -y
                Remove-Item rustup-init.exe
            }
        - $env:Path += ";$env:USERPROFILE\.cargo\bin"
        # Install frontend dependencies
        - cd frontend
        - npm ci
    script:
        # Build frontend
        - npm run build
        # Build Tauri app for Windows
        - cd ..\backend
        - ..\frontend\node_modules\.bin\tauri build
    artifacts:
        paths:
            - backend/target/release/bundle/msi/*.msi
            - backend/target/release/bundle/nsis/*.exe
        expire_in: 30 days
    only:
        - tags
        - main

# ==============================================================================
# BUILD STAGE - macOS
# ==============================================================================

build:macos:
    stage: build
    tags:
        - macos
    before_script:
        # Install Homebrew if not present
        - |
            if ! command -v brew &> /dev/null; then
                /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
        # Install Node.js
        - brew install node
        # Install Rust
        - |
            if ! command -v rustc &> /dev/null; then
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                source $HOME/.cargo/env
            fi
        # Install frontend dependencies
        - cd frontend && npm ci
    script:
        # Build frontend
        - npm run build
        # Build Tauri app for macOS
        - cd ../backend && ../frontend/node_modules/.bin/tauri build
    artifacts:
        paths:
            - backend/target/release/bundle/dmg/*.dmg
            - backend/target/release/bundle/macos/*.app
        expire_in: 30 days
    only:
        - tags
        - main

# ==============================================================================
# OPTIONAL: Create release with all artifacts
# ==============================================================================

release:
    stage: .post
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - build:linux
        - build:windows
        - build:macos
    script:
        - echo "Creating release for $CI_COMMIT_TAG"
    release:
        tag_name: $CI_COMMIT_TAG
        description: "Release $CI_COMMIT_TAG"
        assets:
            links:
                - name: "Linux AppImage"
                  url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/backend/target/release/bundle/appimage?job=build:linux"
                - name: "Linux DEB"
                  url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/backend/target/release/bundle/deb?job=build:linux"
                - name: "Windows MSI"
                  url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/backend/target/release/bundle/msi?job=build:windows"
                - name: "Windows Installer"
                  url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/backend/target/release/bundle/nsis?job=build:windows"
                - name: "macOS DMG"
                  url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/backend/target/release/bundle/dmg?job=build:macos"
    only:
        - tags
